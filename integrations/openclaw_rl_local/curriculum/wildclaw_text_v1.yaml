{
  "tasks": [
    {
      "task_id": "arxiv_paper_digest",
      "category": "Productivity Flow",
      "source": "WildClawBench example: ArXiv paper digest",
      "system_setup": "You are helping with a paper triage workflow. Reply with a concise digest and an explicit next-action recommendation.",
      "user_turns": [
        {
          "content": "Summarize these three paper blurbs into a short research digest with sections for themes, risks, and next steps. Paper A: retrieval-augmented agents reduce hallucinations but fail on stale indexes. Paper B: lightweight verifiers catch arithmetic mistakes but add latency. Paper C: memory compression improves long-horizon planning but sometimes drops entity references."
        }
      ],
      "success_checks": [
        {"kind": "contains_all", "values": ["themes", "risks", "next steps"]},
        {"kind": "contains_any", "values": ["hallucination", "latency", "memory"]}
      ],
      "reward_rule": "binary_all_checks",
      "trainable": true
    },
    {
      "task_id": "pdf_batch_classification",
      "category": "Productivity Flow",
      "source": "WildClawBench example: PDF batch classification",
      "system_setup": "You are classifying documents into an operations inbox. Return a table-like bullet list with document, label, and rationale.",
      "user_turns": [
        {
          "content": "Classify these snippets into Contract, Invoice, Research, or Internal Memo. Doc 1: payment due within 30 days, invoice number 8841, remittance instructions. Doc 2: confidentiality, indemnification, governing law, signatures. Doc 3: benchmark methodology, evaluation set, ablation study. Doc 4: hiring freeze lifted for sales team next quarter."
        }
      ],
      "success_checks": [
        {"kind": "contains_all", "values": ["contract", "invoice", "research", "internal memo"]},
        {"kind": "contains_any", "values": ["rationale", "because", "reason"]}
      ],
      "reward_rule": "binary_all_checks",
      "trainable": true
    },
    {
      "task_id": "conflicting_information_resolution",
      "category": "Search & Retrieval",
      "source": "WildClawBench example: conflicting information resolution",
      "system_setup": "You are resolving conflicting sources. Explicitly identify the conflict, pick a best-supported answer, and note uncertainty.",
      "user_turns": [
        {
          "content": "Source A says the vendor supports SAML and SCIM today. Source B says SCIM is on the roadmap and SAML requires enterprise tier. Give me a reconciled answer with best-supported conclusion and a verification plan."
        }
      ],
      "success_checks": [
        {"kind": "contains_all", "values": ["conflict", "conclusion", "verification"]},
        {"kind": "contains_any", "values": ["uncertain", "uncertainty", "verify"]}
      ],
      "reward_rule": "binary_all_checks",
      "trainable": true
    },
    {
      "task_id": "financial_data_extraction",
