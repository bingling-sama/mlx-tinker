      "source": "WildClawBench example: financial data extraction",
      "system_setup": "You are extracting financial metrics into a compact note for a manager.",
      "user_turns": [
        {
          "content": "Extract revenue, operating margin, and free cash flow from this note and present them in a compact summary. Revenue grew from 420M to 510M. Operating margin improved from 11 percent to 14 percent. Free cash flow was 62M this quarter versus 41M last quarter."
        }
      ],
      "success_checks": [
        {"kind": "contains_all", "values": ["revenue", "operating margin", "free cash flow"]},
        {"kind": "contains_any", "values": ["510", "14", "62"]}
      ],
      "reward_rule": "binary_all_checks",
      "trainable": true
    },
