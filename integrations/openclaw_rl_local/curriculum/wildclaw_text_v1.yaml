      "user_turns": [
        {
          "content": "Start a scheduling thread. Alex can do Monday after 3pm or Tuesday before noon. Priya can do Monday 4-6pm. Morgan can do Tuesday 9-11am or Wednesday 1-3pm. Propose the best slot."
